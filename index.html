<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal — Gil Aron</title>
  <style>
    :root {
      --bg: #F5F5F7;
      --surface: #FFFFFF;
      --border: #E5E5EA;
      --text: #1D1D1F;
      --text-secondary: #6E6E73;
      --blue: #007AFF;
      --green: #34C759;
      --orange: #FF9500;
      --red: #FF3B30;
      --blue-light: #E8F4FF;
      --green-light: #E8FAF0;
      --orange-light: #FFF4E6;
      --red-light: #FFE8E6;
      --radius: 14px;
      --shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 100px;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px 16px;
      position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.4px; }
    header p { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

    .container { max-width: 480px; margin: 0 auto; padding: 0 16px; }

    /* Month nav */
    .month-nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 0 14px; }
    .month-nav h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.6px; }
    .nav-btn {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1.5px solid var(--border); background: var(--surface);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--text); transition: background 0.12s; user-select: none;
    }
    .nav-btn:hover { background: var(--bg); }
    .nav-btn:disabled { opacity: 0.25; cursor: default; }

    /* Progress card */
    .progress-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .pkg-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    .pkg-label { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; }
    .reload-btn {
      font-size: 12px; font-weight: 600; color: var(--blue);
      background: var(--blue-light); border: none; border-radius: 20px;
      padding: 6px 12px; cursor: pointer; font-family: inherit;
      transition: opacity 0.12s;
    }
    .reload-btn:active { opacity: 0.7; }
    .pkg-stats { display: flex; align-items: center; }
    .stat-item { flex: 1; text-align: center; }
    .stat-num { font-size: 28px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
    .stat-num.green { color: var(--green); }
    .stat-num.blue { color: var(--blue); }
    .stat-num.gray { color: var(--text-secondary); }
    .stat-lbl { font-size: 11px; color: var(--text-secondary); margin-top: 3px; font-weight: 500; }
    .stat-sep { width: 1px; height: 36px; background: var(--border); flex-shrink: 0; }

    /* Calendar */
    .calendar {
      background: var(--surface); border-radius: var(--radius);
      padding: 14px; box-shadow: var(--shadow); margin-bottom: 14px;
    }
    .calendar-weekdays { display: grid; grid-template-columns: repeat(7,1fr); margin-bottom: 6px; }
    .calendar-weekday {
      text-align: center; font-size: 10px; font-weight: 700;
      color: var(--text-secondary); padding: 4px 0;
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    .calendar-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
    .calendar-day {
      border-radius: 9px; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.12s;
      padding: 6px 2px 5px; min-height: 46px;
    }
    .calendar-day:hover:not(.empty) { background: var(--bg); }
    .calendar-day.empty { cursor: default; }
    .calendar-day.today { background: var(--blue-light); }
    .calendar-day.today .day-number { color: var(--blue); font-weight: 700; }
    .day-number { font-size: 13px; font-weight: 500; line-height: 1; }
    .day-dots { display: flex; gap: 2px; margin-top: 4px; flex-wrap: wrap; justify-content: center; min-height: 7px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot-agendada { background: var(--blue); }
    .dot-feita { background: var(--green); }
    .dot-remarcada { background: var(--orange); }

    /* List */
    .pkg-divider {
      font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
      padding: 16px 4px 8px; color: var(--text-secondary);
    }
    .pkg-divider-done { color: var(--green); }
    .pkg-divider-active { color: var(--blue); }
    .pkg-divider-avail { color: var(--orange); }
    .pkg-empty {
      font-size: 13px; color: var(--text-secondary);
      padding: 10px 4px 6px; font-style: italic;
    }
    .avail-info {
      background: var(--surface); border-radius: var(--radius);
      padding: 14px 16px; box-shadow: var(--shadow);
      font-style: normal; font-size: 14px; color: var(--text);
      font-weight: 500;
    }
    .session-item {
      background: var(--surface); border-radius: var(--radius);
      padding: 14px 16px; box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 12px;
      cursor: pointer; transition: transform 0.1s;
      margin-bottom: 8px;
    }
    .session-item:active { transform: scale(0.985); }
    .session-indicator { width: 4px; height: 36px; border-radius: 2px; flex-shrink: 0; }
    .ind-agendada { background: var(--blue); }
    .ind-feita { background: var(--green); }
    .ind-remarcada { background: var(--orange); }
    .session-info { flex: 1; min-width: 0; }
    .session-date { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
    .session-meta { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .badge {
      font-size: 11px; font-weight: 600; padding: 4px 10px;
      border-radius: 20px; text-transform: uppercase; letter-spacing: 0.4px; flex-shrink: 0;
    }
    .badge-agendada { background: var(--blue-light); color: var(--blue); }
    .badge-feita { background: var(--green-light); color: #1a8a3a; }
    .badge-remarcada { background: var(--orange-light); color: #b86e00; }

    /* FAB */
    .fab {
      position: fixed; bottom: 28px; right: 24px;
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--blue); color: white; font-size: 26px;
      border: none; cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,122,255,0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; transition: transform 0.12s;
    }
    .fab:active { transform: scale(0.93); }

    /* Modal */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      z-index: 100; display: flex; align-items: flex-end; justify-content: center;
    }
    .overlay.hidden { display: none; }
    .modal {
      background: var(--surface); border-radius: 22px 22px 0 0;
      padding: 12px 20px 36px; width: 100%; max-width: 480px;
      max-height: 88vh; overflow-y: auto;
    }
    .handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 18px; }
    .modal-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-label {
      font-size: 12px; font-weight: 600; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block;
    }
    .form-input {
      width: 100%; padding: 13px 14px; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 16px; font-family: inherit;
      color: var(--text); background: var(--bg); outline: none; transition: border-color 0.15s;
    }
    .form-input:focus { border-color: var(--blue); background: white; }
    .status-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .status-opt {
      padding: 11px 8px; border-radius: 10px; border: 1.5px solid var(--border);
      cursor: pointer; display: flex; flex-direction: column; align-items: center;
      gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-secondary);
      transition: all 0.12s; user-select: none;
    }
    .status-opt.sel-agendada { border-color: var(--blue); background: var(--blue-light); color: var(--blue); }
    .status-opt.sel-feita { border-color: var(--green); background: var(--green-light); color: #1a8a3a; }
    .status-opt.sel-remarcada { border-color: var(--orange); background: var(--orange-light); color: #b86e00; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; }
    /* Muscle group chips */
    .group-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .group-chip {
      padding: 9px 16px; border-radius: 20px; border: 1.5px solid var(--border);
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
      cursor: pointer; transition: all 0.12s; user-select: none; background: var(--bg);
      font-family: inherit;
    }
    .group-chip.sel { border-color: var(--blue); background: var(--blue-light); color: var(--blue); }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    .btn {
      flex: 1; padding: 15px; border-radius: 12px; font-size: 16px;
      font-weight: 600; border: none; cursor: pointer; font-family: inherit; transition: opacity 0.12s;
    }
    .btn:active { opacity: 0.75; }
    .btn-cancel { background: var(--bg); color: var(--text); }
    .btn-save { background: var(--blue); color: white; }
    .btn-delete { background: var(--red-light); color: var(--red); flex: 0 0 auto; padding: 15px 18px; }
  </style>
</head>
<body>

<header>
  <div class="container">
    <h1>Personal Training</h1>
    <p>Gil Aron</p>
  </div>
</header>

<div class="container">
  <div class="month-nav">
    <button class="nav-btn" id="btnPrev" onclick="changeMonth(-1)">&#8249;</button>
    <h2 id="monthTitle"></h2>
    <button class="nav-btn" id="btnNext" onclick="changeMonth(1)">&#8250;</button>
  </div>

  <div class="progress-card">
    <div class="pkg-top">
      <span class="pkg-label" id="pkgLabel">Carregando...</span>
      <button class="reload-btn" onclick="openReload()">+ Recarregar</button>
    </div>
    <div class="pkg-stats">
      <div class="stat-item">
        <div class="stat-num green" id="statDone">0</div>
        <div class="stat-lbl">feitas</div>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-item">
        <div class="stat-num blue" id="statSched">0</div>
        <div class="stat-lbl">agendadas</div>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-item">
        <div class="stat-num gray" id="statAvail">0</div>
        <div class="stat-lbl">disponíveis</div>
      </div>
    </div>
  </div>

  <div class="calendar">
    <div class="calendar-weekdays">
      <div class="calendar-weekday">Dom</div>
      <div class="calendar-weekday">Seg</div>
      <div class="calendar-weekday">Ter</div>
      <div class="calendar-weekday">Qua</div>
      <div class="calendar-weekday">Qui</div>
      <div class="calendar-weekday">Sex</div>
      <div class="calendar-weekday">Sab</div>
    </div>
    <div class="calendar-grid" id="calGrid"></div>
  </div>

  <div id="listSection"></div>
</div>

<button class="fab" onclick="openAdd()">+</button>

<!-- Session modal -->
<div class="overlay hidden" id="overlay" onclick="handleOverlay(event)">
  <div class="modal">
    <div class="handle"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="form-group">
      <label class="form-label">Data</label>
      <input type="date" class="form-input" id="fDate" min="2026-01-01" max="2027-12-31">
    </div>
    <div class="form-group">
      <label class="form-label">Horario</label>
      <input type="time" class="form-input" id="fTime">
    </div>
    <div class="form-group">
      <label class="form-label">Status</label>
      <div class="status-grid">
        <div class="status-opt" id="opt-agendada" onclick="pickStatus('agendada')">
          <div class="status-dot dot-agendada"></div>Agendada
        </div>
        <div class="status-opt" id="opt-feita" onclick="pickStatus('feita')">
          <div class="status-dot dot-feita"></div>Feita
        </div>
        <div class="status-opt" id="opt-remarcada" onclick="pickStatus('remarcada')">
          <div class="status-dot dot-remarcada"></div>Remarcada
        </div>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Grupo Muscular</label>
      <div class="group-chips">
        <button class="group-chip" id="grp-superior"  onclick="pickGroup('Superior')">Superior</button>
        <button class="group-chip" id="grp-inferior"  onclick="pickGroup('Inferior')">Inferior</button>
        <button class="group-chip" id="grp-fullbody"  onclick="pickGroup('Full Body')">Full Body</button>
        <button class="group-chip" id="grp-cardio"    onclick="pickGroup('Cardio')">Cardio</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Observacao</label>
      <input type="text" class="form-input" id="fNotes" placeholder="anotacoes livres sobre o treino...">
    </div>
    <div class="actions" id="modalActions"></div>
  </div>
</div>

<!-- Reload modal -->
<div class="overlay hidden" id="reloadOverlay" onclick="handleReloadOverlay(event)">
  <div class="modal">
    <div class="handle"></div>
    <div class="modal-title">Recarregar Pacote</div>
    <div class="form-group">
      <label class="form-label">Quantas aulas voce comprou?</label>
      <input type="number" class="form-input" id="reloadQty" min="1" max="50" placeholder="ex: 12">
    </div>
    <div class="actions">
      <button class="btn btn-cancel" onclick="closeReload()">Cancelar</button>
      <button class="btn btn-save" onclick="saveReload()">Confirmar</button>
    </div>
  </div>
</div>

<script>
  const DB = 'https://personal-gil-default-rtdb.firebaseio.com';
  const MONTHS = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho',
                  'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const WDAYS  = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
  const STATUS_LABELS = { agendada:'Agendada', feita:'Feita', remarcada:'Remarcada' };

  let sessions = [];
  let packages = [];
  let curMonth = Math.max(4, Math.min(11, new Date().getMonth()));
  let curYear  = 2026;
  let editId   = null;
  let selStatus = 'agendada';
  let selGroup  = '';

  // ── Firebase ────────────────────────────────────────────────────────
  async function dbGet(path) {
    const res = await fetch(`${DB}/${path}.json`);
    return res.json();
  }
  async function dbSet(path, data) {
    await fetch(`${DB}/${path}.json`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
  }
  async function saveAll() {
    await Promise.all([dbSet('sessions', sessions), dbSet('packages', packages)]);
  }

  // ── Migration: assign pkgId to old sessions ──────────────────────────
  function migrate(ss, pp) {
    const sorted = [...ss].sort((a,b) => a.date.localeCompare(b.date));
    const pkgs   = pp.length > 0 ? [...pp] : [{id:1, size:12}];
    let pkgIdx = 0, counter = 0;

    for (const s of sorted) {
      if (s.pkgId) continue;
      if (pkgIdx >= pkgs.length) pkgs.push({id: pkgs.length+1, size:12});
      s.pkgId = pkgs[pkgIdx].id;
      if (s.status !== 'remarcada') {
        counter++;
        if (counter >= pkgs[pkgIdx].size) { pkgIdx++; counter = 0; }
      }
    }
    return { sessions: sorted, packages: pkgs };
  }

  // ── Load ─────────────────────────────────────────────────────────────
  async function loadFromDB() {
    try {
      const [sData, pData] = await Promise.all([dbGet('sessions'), dbGet('packages')]);

      let ss = Array.isArray(sData) ? sData
             : (sData && typeof sData==='object') ? Object.values(sData) : [];
      let pp = Array.isArray(pData) ? pData
             : (pData && typeof pData==='object') ? Object.values(pData) : [];

      // Remove nulls
      ss = ss.filter(Boolean);
      pp = pp.filter(Boolean);

      const needsMigration = ss.length > 0 && ss.some(s => !s.pkgId);
      if (needsMigration) {
        const m = migrate(ss, pp);
        ss = m.sessions; pp = m.packages;
        await Promise.all([dbSet('sessions', ss), dbSet('packages', pp)]);
      }

      if (ss.length === 0 && pp.length === 0) {
        pp = [{id:1, size:12}];
        await dbSet('packages', pp);
      }

      return { sessions: ss, packages: pp };
    } catch(e) {
      console.error('Load error:', e);
      return { sessions: [], packages: [{id:1, size:12}] };
    }
  }

  // ── Helpers ───────────────────────────────────────────────────────────
  function validCount() { return sessions.filter(s => s.status !== 'remarcada').length; }
  function totalPurchased() { return packages.reduce((sum,p) => sum + p.size, 0); }
  function available() { return Math.max(0, totalPurchased() - validCount()); }

  function currentPkgId() {
    for (const p of packages) {
      const used = sessions.filter(s => s.pkgId===p.id && s.status!=='remarcada').length;
      if (used < p.size) return p.id;
    }
    return packages.length > 0 ? packages[packages.length-1].id : 1;
  }

  function monthSessions() {
    return sessions
      .filter(s => { const d=new Date(s.date+'T12:00:00'); return d.getMonth()===curMonth && d.getFullYear()===curYear; })
      .sort((a,b) => a.date.localeCompare(b.date));
  }

  function isToday(ds) {
    const t=new Date(), d=new Date(ds+'T12:00:00');
    return t.getDate()===d.getDate() && t.getMonth()===d.getMonth() && t.getFullYear()===d.getFullYear();
  }
  function fmtDate(ds) {
    const d=new Date(ds+'T12:00:00');
    return `${WDAYS[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  function fmtTime(t) { return t.slice(0,5)+'h'; }

  // ── Render ────────────────────────────────────────────────────────────
  function render() {
    renderNav();
    renderProgress();
    renderCalendar();
    renderList();
  }

  function renderNav() {
    document.getElementById('monthTitle').textContent = MONTHS[curMonth] + ' ' + curYear;
    document.getElementById('btnPrev').disabled = curMonth <= 4;
    document.getElementById('btnNext').disabled = curMonth >= 11;
  }

  function renderProgress() {
    const done  = sessions.filter(s => s.status==='feita').length;
    const sched = sessions.filter(s => s.status==='agendada').length;
    const avail = available();

    // Find active package
    let activePkg = packages.find(p => {
      const used = sessions.filter(s => s.pkgId===p.id && s.status!=='remarcada').length;
      return used < p.size;
    });
    if (!activePkg && packages.length > 0) activePkg = packages[packages.length-1];

    let labelText = activePkg ? `Pacote ${activePkg.id}` : 'Sem pacote';
    if (avail === 0 && sched === 0 && done > 0) labelText += ' · tudo feito';
    else if (avail === 0 && sched > 0)          labelText += ' · em andamento';
    else if (avail > 0)                          labelText += ' · em andamento';

    document.getElementById('pkgLabel').textContent = labelText;
    document.getElementById('statDone').textContent  = done;
    document.getElementById('statSched').textContent = sched;
    document.getElementById('statAvail').textContent = avail;
  }

  function renderCalendar() {
    const ms = monthSessions();
    const firstDay = new Date(curYear, curMonth, 1).getDay();
    const lastDay  = new Date(curYear, curMonth+1, 0).getDate();
    const byDay = {};
    ms.forEach(s => { const d=new Date(s.date+'T12:00:00').getDate(); (byDay[d]=byDay[d]||[]).push(s); });

    let html = '';
    for (let i=0; i<firstDay; i++) html += '<div class="calendar-day empty"></div>';
    for (let d=1; d<=lastDay; d++) {
      const ds = `${curYear}-${String(curMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const ss = byDay[d]||[];
      const cls = ['calendar-day', isToday(ds)?'today':'', ss.length?'has-session':''].filter(Boolean).join(' ');
      const firstId = ss.length ? ss[0].id : null;
      html += `<div class="${cls}" onclick="dayClick('${ds}',${firstId})">`;
      html += `<div class="day-number">${d}</div><div class="day-dots">`;
      ss.forEach(s => { html += `<div class="dot dot-${s.status}"></div>`; });
      html += '</div></div>';
    }
    document.getElementById('calGrid').innerHTML = html;
  }

  function renderList() {
    const sec = document.getElementById('listSection');
    const sortedAll = [...sessions].sort((a,b) => a.date.localeCompare(b.date));
    let html = '';

    packages.forEach(pkg => {
      const pkgSess = sortedAll.filter(s => s.pkgId === pkg.id);
      const validInPkg = pkgSess.filter(s => s.status !== 'remarcada').length;
      const isComplete = validInPkg >= pkg.size;

      let divClass = isComplete ? 'pkg-divider-done' : 'pkg-divider-active';
      let statusText = isComplete
        ? ` · concluido (${pkg.size}/${pkg.size})`
        : ` · em andamento (${validInPkg}/${pkg.size})`;

      html += `<div class="pkg-divider ${divClass}">── Pacote ${pkg.id}${statusText}</div>`;

      if (pkgSess.length === 0) {
        html += `<div class="pkg-empty">Nenhuma aula agendada neste pacote ainda</div>`;
      } else {
        pkgSess.forEach(s => {
          html += `
            <div class="session-item" onclick="openEdit(${s.id})">
              <div class="session-indicator ind-${s.status}"></div>
              <div class="session-info">
                <div class="session-date">${fmtDate(s.date)}</div>
                <div class="session-meta">${fmtTime(s.time)}${s.group?' · '+s.group:''}${s.notes?' · '+s.notes:''}</div>
              </div>
              <span class="badge badge-${s.status}">${STATUS_LABELS[s.status]}</span>
            </div>`;
        });
      }
    });

    // Available credits section
    const avail = available();
    if (avail > 0) {
      html += `<div class="pkg-divider pkg-divider-avail">── Disponiveis · ${avail} sem agendamento</div>`;
      html += `<div class="avail-info">Voce tem ${avail} aula${avail>1?'s':''} pagas aguardando agendamento</div>`;
    }

    if (packages.length === 0) {
      html = '<div style="text-align:center;padding:32px;color:var(--text-secondary)"><div style="font-size:28px;margin-bottom:8px">📅</div><p>Nenhum pacote cadastrado</p></div>';
    }

    sec.innerHTML = html;
  }

  // ── Navigation ────────────────────────────────────────────────────────
  function changeMonth(dir) {
    curMonth = Math.max(4, Math.min(11, curMonth + dir));
    render();
  }
  function dayClick(ds, id) {
    if (id) openEdit(id); else openAdd(ds);
  }

  // ── Session modal ─────────────────────────────────────────────────────
  function openAdd(ds) {
    editId = null; selStatus = 'agendada'; selGroup = '';
    document.getElementById('modalTitle').textContent = 'Nova Aula';
    document.getElementById('fDate').value = ds || `${curYear}-${String(curMonth+1).padStart(2,'0')}-01`;
    document.getElementById('fTime').value = '05:00';
    document.getElementById('fNotes').value = '';
    setStatusUI('agendada');
    setGroupUI();
    document.getElementById('modalActions').innerHTML = `
      <button class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-save" onclick="saveSession()">Salvar</button>`;
    document.getElementById('overlay').classList.remove('hidden');
  }

  function openEdit(id) {
    const s = sessions.find(x => x.id===id);
    if (!s) return;
    editId = id; selStatus = s.status; selGroup = s.group||'';
    document.getElementById('modalTitle').textContent = 'Editar Aula';
    document.getElementById('fDate').value  = s.date;
    document.getElementById('fTime').value  = s.time;
    document.getElementById('fNotes').value = s.notes||'';
    setStatusUI(s.status);
    setGroupUI();
    document.getElementById('modalActions').innerHTML = `
      <button class="btn btn-delete" onclick="delSession(${id})">Excluir</button>
      <button class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-save" onclick="saveSession()">Salvar</button>`;
    document.getElementById('overlay').classList.remove('hidden');
  }

  function closeModal() { document.getElementById('overlay').classList.add('hidden'); }
  function handleOverlay(e) { if (e.target===document.getElementById('overlay')) closeModal(); }
  function pickStatus(st) { selStatus=st; setStatusUI(st); }
  function setStatusUI(st) {
    ['agendada','feita','remarcada'].forEach(s => {
      document.getElementById('opt-'+s).className = 'status-opt' + (s===st ? ' sel-'+s : '');
    });
  }

  const GROUPS = { 'Superior':'grp-superior', 'Inferior':'grp-inferior', 'Full Body':'grp-fullbody', 'Cardio':'grp-cardio' };
  function pickGroup(g) {
    selGroup = selGroup===g ? '' : g; // toggle
    setGroupUI();
  }
  function setGroupUI() {
    Object.entries(GROUPS).forEach(([g, id]) => {
      document.getElementById(id).className = 'group-chip' + (selGroup===g ? ' sel' : '');
    });
  }

  async function saveSession() {
    const date  = document.getElementById('fDate').value;
    const time  = document.getElementById('fTime').value || '05:00';
    const notes = document.getElementById('fNotes').value.trim();
    if (!date) return;

    if (editId) {
      const i = sessions.findIndex(s => s.id===editId);
      if (i>=0) sessions[i] = { ...sessions[i], date, time, status:selStatus, notes, group:selGroup };
    } else {
      const newId = (sessions.reduce((m,s) => Math.max(m,s.id), 0)) + 1;
      sessions.push({ id:newId, date, time, status:selStatus, notes, group:selGroup, pkgId:currentPkgId() });
    }

    closeModal();
    curMonth = new Date(date+'T12:00:00').getMonth();
    render();
    await saveAll();
  }

  async function delSession(id) {
    if (!confirm('Excluir esta aula?')) return;
    sessions = sessions.filter(s => s.id!==id);
    closeModal();
    render();
    await saveAll();
  }

  // ── Reload modal ──────────────────────────────────────────────────────
  function openReload() {
    document.getElementById('reloadQty').value = '';
    document.getElementById('reloadOverlay').classList.remove('hidden');
  }
  function closeReload() { document.getElementById('reloadOverlay').classList.add('hidden'); }
  function handleReloadOverlay(e) { if (e.target===document.getElementById('reloadOverlay')) closeReload(); }

  async function saveReload() {
    const qty = parseInt(document.getElementById('reloadQty').value);
    if (!qty || qty < 1) return;
    const newId = (packages.reduce((m,p) => Math.max(m,p.id), 0)) + 1;
    packages.push({ id:newId, size:qty });
    closeReload();
    render();
    await saveAll();
  }

  // ── Init ──────────────────────────────────────────────────────────────
  loadFromDB().then(data => {
    sessions = data.sessions;
    packages = data.packages;
    render();
  });
</script>
</body>
</html>
